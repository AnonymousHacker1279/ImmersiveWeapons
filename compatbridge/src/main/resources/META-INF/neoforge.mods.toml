modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/AnonymousHacker1279/ImmersiveWeapons/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Immersive Weapons Compatibility Bridge"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/immersive-weapons-compatibility-bridge"
updateJSONURL = "https://raw.githubusercontent.com/AnonymousHacker1279/ImmersiveWeapons/master/compatbridge/update.json"
bannerFile = "banner.png"
iconFile = "icon.png"
credits = "Written by AnonymousHacker1279"
authors = "AnonymousHacker1279"
description = '''
The Immersive Weapons Compatibility Bridge adds compatibility to several mods.
'''

[[dependencies.iwcompatbridge]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.iwcompatbridge]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.iwcompatbridge]]
modId = "immersiveweapons"
type = "required"
versionRange = "[26.3-1.40.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.iwcompatbridge]]
modId = "curios"
type = "optional"
versionRange = "[17.0.0-beta.2+26.3,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.iwcompatbridge]]
modId = "wthit"
type = "optional"
versionRange = "[20.0.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.iwcompatbridge]]
modId = "jei"
type = "optional"
versionRange = "[31.9.0.56,)"
ordering = "NONE"
side = "BOTH"